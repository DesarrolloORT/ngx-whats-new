name: Publish package and attach to release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and attach assets to (e.g. v4.0.0)'
        required: true

env:
  RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}

permissions:
  contents: write # upload release assets
  packages: write # publish to GitHub Packages

jobs:
  release:
    name: Publish package and attach to release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm install

      - name: Build library
        run: npm run build

      # The two packages are versioned independently, so a release may only bump one of
      # them. Publishing a version that already exists fails with a 409, which would take
      # down the whole job (and the tarball upload with it) — so skip what's already there.
      - name: Publish packages (skipping versions already on the registry)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in ngx-whats-new angularjs-whats-new; do
            NAME=$(jq -r .name "dist/$pkg/package.json")
            VERSION=$(jq -r .version "dist/$pkg/package.json")
            # `npm view` exits 0 with empty output when the version is missing, and
            # non-zero (E404) when the package itself is unknown — check the output.
            if [ -n "$(npm view "$NAME@$VERSION" version 2>/dev/null || true)" ]; then
              echo "::notice::$NAME@$VERSION is already published — skipping"
            else
              echo "Publishing $NAME@$VERSION"
              ( cd "dist/$pkg" && npm publish )
            fi
          done

      - name: Generate tarballs
        run: |
          mkdir -p release-assets
          for pkg in ngx-whats-new angularjs-whats-new; do
            VERSION=$(jq -r .version "dist/$pkg/package.json")
            ( cd "dist/$pkg" && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets" )
            mv "release-assets/desarrolloort-$pkg-$VERSION.tgz" "release-assets/$pkg-$VERSION.tgz"
          done

      - name: Upload tarballs to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" release-assets/*.tgz --clobber
