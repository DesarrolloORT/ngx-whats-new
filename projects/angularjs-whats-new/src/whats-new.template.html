<div class="wn-modal-container" ng-if="vm._isVisible">
  <div
    role="dialog"
    class="wn-modal"
    aria-modal="true"
    aria-labelledby="modal-title"
    aria-describedby="modal-description"
    ng-style="{'max-width': vm._options.customStyle && vm._options.customStyle.maxWidth}">
    <button
      ng-if="!vm._options.disableClose"
      aria-label="Close dialog"
      class="wn-close-modal-button"
      ng-click="vm.close()">
      ⛌
    </button>

    <div class="wn-modal-layout">
      <div
        class="wn-modal-body"
        aria-live="polite"
        ng-style="{
          'padding-top': (vm._items[vm._selectedIndex].image || vm._options.disableClose) ? '' : 'calc(2 * var(--_body-spacing))',
          'border': vm._options.customStyle && vm._options.customStyle.border
        }"
        ng-class="{'wn-content-animate': vm._contentAnimationState}">
        <!-- Image Section -->
        <div
          ng-if="vm._items[vm._selectedIndex].image"
          class="wn-image"
          ng-style="{
            'background': vm._items[vm._selectedIndex].image.background,
            'aspect-ratio': vm._items[vm._selectedIndex].image.aspectRatio
          }">
          <div class="wn-image-placeholder" ng-if="!vm._imageHasLoaded">
            <div class="wn-image-loader"></div>
          </div>

          <img
            ng-src="{{vm._items[vm._selectedIndex].image.src}}"
            alt="{{vm._items[vm._selectedIndex].image.altText}}"
            ng-load="vm.onImageLoad()"
            ng-error="vm.onImageError()"
            ng-style="{'object-fit': vm._items[vm._selectedIndex].image.objectFit}"
            ng-class="{
              'wn-image-loaded': vm._imageHasLoaded,
              'wn-image-not-loaded': !vm._imageHasLoaded
            }"
            onload="angular.element(this).scope().$apply(function(scope) { scope.vm.onImageLoad(); })"
            onerror="angular.element(this).scope().$apply(function(scope) { scope.vm.onImageError(); })" />
        </div>

        <!-- Info Body Section -->
        <div class="wn-info-body">
          <h2 class="wn-title" ng-if="vm._items[vm._selectedIndex].title">
            {{vm._items[vm._selectedIndex].title}}
          </h2>

          <p class="wn-paragraph" ng-if="vm._items[vm._selectedIndex].text">
            {{vm._items[vm._selectedIndex].text}}
          </p>

          <div
            class="wn-paragraph html"
            ng-if="vm._items[vm._selectedIndex].html"
            ng-bind-html="vm.trustHtml(vm._items[vm._selectedIndex].html)"></div>

          <button
            ng-if="vm._items[vm._selectedIndex].button"
            class="wn-button"
            ng-style="{'align-self': vm._items[vm._selectedIndex].button.position || 'center'}"
            ng-click="vm.goToNext()">
            {{vm._items[vm._selectedIndex].button.text}}
          </button>
        </div>
      </div>

      <!-- Navigation Dots -->
      <nav
        ng-if="vm._items.length > 1"
        aria-label="Carousel-like item navigation"
        class="wn-navigation">
        <ul class="wn-navigation-list" aria-label="Carousel Tabs">
          <li
            ng-repeat="item in vm._items track by $index"
            class="wn-dot"
            role="tabpanel"
            ng-class="{
              'clickable': vm._options.clickableNavigationDots,
              'active': $index === vm._selectedIndex,
              'inactive': $index !== vm._selectedIndex
            }">
            <button
              role="tab"
              ng-attr-aria-selected="{{$index === vm._selectedIndex}}"
              ng-attr-aria-controls="tabpanel-{{$index}}"
              id="tab-{{$index}}"
              tabindex="{{$index === vm._selectedIndex ? '0' : '-1'}}"
              ng-click="vm.navigateTo($index)"
              ng-attr-aria-label="{{($index === vm._selectedIndex ? 'Current slide, ' : '') + 'Navigate to item ' + ($index + 1)}}"
              class="wn-nav-button">
              Navigate to item {{$index + 1}}
            </button>
          </li>
        </ul>
      </nav>
    </div>
  </div>

  <div class="wn-backdrop" aria-hidden="true" ng-click="vm.close()"></div>

  <h1 class="sr-only" id="modal-title">Update information dialog</h1>
  <p class="sr-only" id="modal-description">
    This dialog contains information related to the latest features and fixes.
  </p>
</div>
